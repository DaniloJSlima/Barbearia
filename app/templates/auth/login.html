{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="caixa caixa-centro">
  <h1>Entrar</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail <input type="email" name="email" required autofocus value="{{ request.form.email }}"></label>
    <label>Senha <input type="password" name="senha" required></label>
    <label class="check"><input type="checkbox" name="lembrar"> Manter conectado</label>
    <button class="btn">Entrar</button>
  </form>
  <p class="suave">Não tem conta? <a href="{{ url_for('auth.registro') }}">Crie aqui</a>.</p>
</div>
{% endblock %}
